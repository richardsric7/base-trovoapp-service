basePath: /
definitions:
  health.DependencyStatus:
    properties:
      error:
        type: string
      latency_ms:
        example: 4
        type: integer
      latency_us:
        example: 4210
        type: integer
      name:
        example: wallet_db
        type: string
      optional:
        type: boolean
      skip_reason:
        type: string
      status:
        example: up
        type: string
    type: object
  health.LivenessResponse:
    properties:
      service:
        example: payment-history-engine
        type: string
      status:
        example: up
        type: string
      time:
        example: "2026-09-10T12:00:00Z"
        type: string
      uptime_seconds:
        example: 3600
        type: integer
      version:
        example: a1b2c3d
        type: string
    type: object
  health.ReadinessResponse:
    properties:
      dependencies:
        items:
          $ref: '#/definitions/health.DependencyStatus'
        type: array
      service:
        example: payment-history-engine
        type: string
      status:
        example: up
        type: string
      stream:
        $ref: '#/definitions/health.StreamStatus'
      time:
        example: "2026-09-10T12:00:00Z"
        type: string
      uptime_seconds:
        example: 3600
        type: integer
      version:
        example: a1b2c3d
        type: string
    type: object
  health.StreamStatus:
    properties:
      last_cursor:
        type: string
      last_operation_at:
        type: string
      note:
        type: string
      operations_processed:
        example: 14238
        type: integer
      seconds_since_last_operation:
        type: integer
      status:
        example: up
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Background worker that indexes on-chain Base (EVM) payment activity
    - native transfers and B20/ERC-20 Transfer events - for Trovo Wallet''s tracked
    wallets, writing the results to its own RoachDB (CockroachDB) payment-history
    database. It has no request/response API of its own: the only HTTP surface is
    the liveness/readiness probe pair documented below, served for monitoring purposes.'
  title: Payment History Engine
  version: "1.0"
paths:
  /health:
    get:
      description: |-
        Reports that the payment-history-engine process is running. Performs no
        dependency checks, so it stays 200 even while a database or the Base RPC
        node is unreachable - use GET /ready to decide whether the service is able
        to do its job. Intended for container/orchestrator liveness checks. No
        authentication required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.LivenessResponse'
      summary: Liveness probe
      tags:
      - Health
  /ready:
    get:
      description: |-
        Checks every backing dependency in parallel (the primary wallet database,
        the RoachDB payment-history database, Redis when ENABLE_CACHING=1, and the
        Base RPC node) and reports each one individually, alongside whether the
        block-processing stream is still making progress. Returns 503 only when a
        REQUIRED dependency (wallet_db or roach_db) is down. An optional dependency
        being down, or the stream having stalled, is reported as "degraded" but
        still returns 200 - restarting the container would not fix a network outage
        or a quiet chain, so this deliberately avoids causing a restart loop. No
        authentication required.
      produces:
      - application/json
      responses:
        "200":
          description: Ready (status up, idle, or degraded)
          schema:
            $ref: '#/definitions/health.ReadinessResponse'
        "503":
          description: A required dependency (wallet_db or roach_db) is down
          schema:
            $ref: '#/definitions/health.ReadinessResponse'
      summary: Readiness probe
      tags:
      - Health
swagger: "2.0"
