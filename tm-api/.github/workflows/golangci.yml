name: Go Lint and Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  golint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go 1.x
        uses: actions/setup-go@v4
        with:
          go-version: "^1.16"

      - name: Install golint
        run: |
          go install golang.org/x/lint/golint@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run golint
        run: golint ./...

      - name: Run tests
        run: go test ./...
