        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Get wallet distribution data
      tags:
      - Wallets
