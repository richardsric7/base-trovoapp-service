        has not been minted yet. app-backend verifies on-chain that the contract''s
        symbol is the asset code, its supply is zero, and the asset''s issuing Safe
        (issuingWalletAddress) holds MINTER_ROLE or is the owner. The issuing Safe
        is not the token: deploy the token with the issuing Safe as its owner/minter,
        then register it here.'
