        in: query
        name: ownerUsername
        type: string
      - description: Filter by short name (partial match)
        in: query
        name: shortName
        type: string
      - description: Filter by active status (true/false)
        in: query
        name: inactive
        type: string
      - description: Filter by verified status (true/false)
        in: query
        name: verified
        type: string
      - description: Filter by suspended status (true/false)
        in: query
        name: suspended
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Data'
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: List service links
      tags:
      - ServiceLinks
    post:
      consumes:
      - application/json
      description: 'Action must be one of: `create`, `update`. ID should only be provided
        for `update`. On create, the owner username must already exist in the users
        table - its wallet address is copied onto the new row, and the ID/API key
        are always server-generated GUIDs, never accepted from the client.'
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Service link payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.ServiceLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
