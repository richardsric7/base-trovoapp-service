        "400":
          description: 'error": "invalid payload or update failed'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error": "Unauthorized access. Only admins can access this
            endpoint'
          schema:
            additionalProperties:
              type: string
            type: object
