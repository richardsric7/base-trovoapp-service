  /organizations/invite/root-user:
    post:
      consumes:
      - application/json
      description: |-
        Usable by Trovo Admin Only. Invite an organization by providing their admin's email and role is by default set as: "ROOT_SUPER_ADMIN".
        Valid organization types: ASSET_MANAGER, ASSET_CUSTODIAN, RATING_AGENCY, REGULATOR, LEGAL_AGENCY, PROFESSIONAL_AGENCY

        **Optional Stakeholder Linkage:**
        You can optionally link the organization to an existing stakeholder in the Trovo database by providing both stakeholder_id and stakeholder_type.
        Valid stakeholder_type values: asset_manager, asset_issuing_house, approved_asset_custodian, legal_and_professionals, rating_agency, trustees, legal_adviser, financial_adviser

        Note: Both stakeholder_id and stakeholder_type must be provided together, or both omitted. The stakeholder must exist in the /partners endpoint.
      parameters:
      - description: Stakeholder type
        enum:
        - asset_manager
        - asset_issuing_house
        - approved_asset_custodian
        - legal_and_professionals
        - rating_agency
        - trustees
        - legal_adviser
        - financial_adviser
        in: query
        name: stakeholder_type
        required: true
        type: string
      - description: Admin invitation payload (exclude stakeholder_type from body)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.InviteOrgAdminPayload'
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Admin successfully created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid payload or user does not exist
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add Root Admin
      tags:
      - organizations
