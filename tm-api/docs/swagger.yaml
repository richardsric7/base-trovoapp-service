  /login/stream/{loginID}:
    get:
      description: Server-Sent Events stream that pushes a "loginNotice" event the
        moment BroadcastToLoginID fires for this loginID (i.e. the moment the wallet
        approval callback arrives). The event payload only signals that a check is
        worth doing now — the client still calls GET /users/verify/:targetUser/:loginID
        to fetch the actual tokens.
      parameters:
      - description: Login ID associated with the login attempt
        in: path
        name: loginID
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: text/event-stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Stream login approval notifications
      tags:
      - Authentication
