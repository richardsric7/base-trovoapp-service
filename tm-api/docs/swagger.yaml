swagger: "2.0"
info:
  contact: {}
  description: This API provides endpoints for handling various metrics and data retrieval.(https://dashboarddev.trovotechnologies.com)
  title: Admin dashboard metrics and data retrieval
  version: 1.0.0
paths:
  /admin/careers/roles:
    get:
      description: Retrieves all career roles (including drafts) with optional filters.
        Admin endpoint, authentication required.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Filter by status
        enum:
        - draft
        - published
        - disabled
        in: query
        name: status
        type: string
      - description: Filter by location
        enum:
        - remote
        - hybrid
        - onsite
        in: query
        name: location
        type: string
      - description: Filter by work type
        enum:
        - fulltime
        - parttime
        - contract
        in: query
        name: work_type
        type: string
      - description: Filter by years of experience
        in: query
        name: years_of_experience
        type: string
      - description: Search in heading and company overview
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CareerRoleResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[Admin] Get all career roles with filters'
      tags:
      - Careers
    post:
      consumes:
      - application/json
      description: Create a new career role. Role will be created in draft status.
        Admin endpoint, authentication required.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Career Role payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.CareerRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CareerRoleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[Admin] Create career role'
      tags:
      - Careers
  /admin/careers/roles/{id}:
    delete:
      description: Deletes a career role record by ID. Admin endpoint, authentication
        required.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Career Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[Admin] Delete career role'
      tags:
      - Careers
    get:
      description: Retrieves a career role by ID regardless of status. Admin endpoint,
        authentication required.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Career Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CareerRoleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[Admin] Get career role by ID'
      tags:
      - Careers
    put:
      consumes:
      - application/json
      description: Updates an existing career role. Status cannot be changed via this
        endpoint. Admin endpoint, authentication required.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Career Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Career Role update payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.CareerRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CareerRoleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[Admin] Update career role'
      tags:
      - Careers
  /admin/careers/roles/{id}/publish:
    put:
      description: Publishes a draft career role, making it visible to the public.
        Only draft roles can be published. Admin endpoint, authentication required.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Career Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CareerRoleResponse'
        "400":
          description: Bad request - role not found or not in draft status
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[Admin] Publish career role'
      tags:
      - Careers
  /admin/careers/roles/{id}/status:
    put:
      consumes:
      - application/json
      description: Updates the status of a career role. Can toggle between 'published'
        (enabled) and 'disabled'. Only published or disabled roles can have their
        status updated. Admin endpoint, authentication required.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Career Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CareerRoleResponse'
        "400":
          description: Bad request - invalid status or role not found
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[Admin] Update career role status'
      tags:
      - Careers
  /admin/invite:
    post:
      consumes:
      - application/json
      description: Usable by SuperAdmin Only. Invite a new admin user by providing
        a trovo user's email and expected role accepted admin_roles are "SUPER_ADMIN"
        , "EDIT_LEVEL_ADMIN",  "VIEW_ONLY_ADMIN"
      parameters:
      - description: Admin invitation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.InviteAdminPayload'
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Admin successfully created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid payload or user does not exist
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add Admin
      tags:
      - Admins
  /admin/list:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of admin users
      parameters:
      - default: 1
        description: Page number (must be >= 1)
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of admins per page (max 100)
        in: query
        name: pageSize
        type: integer
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List Admins
      tags:
      - Admins
  /admin/modify/status:
    patch:
      consumes:
      - application/json
      description: Changes the admin status by updating their status to 'SUPER_ADMIN',
        'EDIT_LEVEL_ADMIN', 'VIEW_ONLY_ADMIN', in the database. Only super admins
        can perform this action.
      parameters:
      - description: Admin suspension details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.ChangeRolePayload'
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message": "Admin status updated to suspended'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error": "Invalid request payload" or "Only ''suspended'' status
            is allowed" or "Admin is already suspended'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error": "Unauthorized access" or "Only super admins can change
            admin status'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error": "Admin user does not exist'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error": "Failed to retrieve admin information" or "InternalServerError"
            or "Failed to update admin status'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Changes the Status an admin
      tags:
      - Admins
  /admin/suspend:
    patch:
      consumes:
      - application/json
      description: Suspends an admin by updating their status to 'SUSPENDED' in the
        database. Requires admin-level authorization.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Admin suspension details, including SuspensionReasonID and SuspensionNote
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.SuspendAdminPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Admin user has been suspended
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload or admin is already suspended
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized access
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Admin user does not exist
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Suspend an admin
      tags:
      - Admins
  /admin/unsuspend:
    patch:
      consumes:
      - application/json
      description: Suspends an admin by updating their status to 'SUSPENDED' in the
        database. Only super admins can perform this action.
      parameters:
      - description: Admin un-suspension details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.UnsuspendAdminPayload'
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message": "Admin status updated to suspended'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error": "Invalid request payload" or "Only ''suspended'' status
            is allowed" or "Admin is already suspended'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error": "Unauthorized access" or "Only super admins can change
            admin status'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 'error": "Admin user does not exist'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error": "Failed to retrieve admin information" or "InternalServerError"
            or "Failed to update admin status'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Suspend an admin
      tags:
      - Admins
  /admin/vault-signer/audit-log:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      summary: View vault signer change history
      tags:
      - Vault Signer - Admin
  /admin/vault-signer/managed-secrets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      summary: List managed signer secrets with their current assignments
      tags:
      - Vault Signer - Admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Managed secret
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.registerManagedSecretRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      summary: Register a new managed signer secret
      tags:
      - Vault Signer - Admin
  /admin/vault-signer/managed-secrets/{id}/assignments:
    get:
      parameters:
      - description: Managed secret ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      summary: List current assignments for one managed secret
      tags:
      - Vault Signer - Admin
    post:
      consumes:
      - application/json
      description: No position is supplied — it starts null and is only claimed the
        first time the owner submits a real signer value. (ManagedSecretID, OwnerRefID)
        is unique — 409 if this owner already has an assignment on this managed secret.
      parameters:
      - description: Managed secret ID
        in: path
        name: id
        required: true
        type: string
      - description: Owner identifier (username for trovo_admin, email for org_member)
          and owner type
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ownerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: owner already assigned to this managed secret
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      summary: Create an assignment (auto-assigned position)
      tags:
      - Vault Signer - Admin
  /admin/vault-signer/managed-secrets/{id}/assignments/{assignmentId}:
    delete:
      description: If no position was ever claimed, this is a plain row delete. Otherwise
        it renumbers every later position down by one and collapses the Vault CSV.
        For an active position with enough redundancy, also removes the signer on-chain
        before the Vault write — reversed automatically if the Vault write then fails.
      parameters:
      - description: Managed secret ID
        in: path
        name: id
        required: true
        type: string
      - description: Assignment ID
        in: path
        name: assignmentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: signer index out of range
          schema:
            additionalProperties: true
            type: object
        "404":
          description: no assignment found with that ID
          schema:
            additionalProperties: true
            type: object
        "409":
          description: would bring the CSV below the minimum entry count
          schema:
            additionalProperties: true
            type: object
        "502":
          description: on-chain removal failed, or Vault was unreachable and all changes
            were reverted
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Vault signer is not configured on this server
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      summary: Delete an assignment
      tags:
      - Vault Signer - Admin
    patch:
      consumes:
      - application/json
      description: Position (null or already claimed) is always retained exactly as-is.
        Never touches Vault or the chain — the new owner picks up the slot the normal
        way, via PUT on their own next write, which claims a position first if none
        has been claimed yet. (ManagedSecretID, OwnerRefID) is unique — 409 if the
        new owner already has a different assignment on this managed secret.
      parameters:
      - description: Managed secret ID
        in: path
        name: id
        required: true
        type: string
      - description: Assignment ID
        in: path
        name: assignmentId
        required: true
        type: string
      - description: New owner identifier and owner type
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ownerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: owner already assigned to this managed secret
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      summary: Reassign the owner of an assignment
      tags:
      - Vault Signer - Admin
  /appeal/list:
    get:
      description: Retrieves the list of trades that are currently on appeal with
        pagination, filtering, and search.
      operationId: GetAppealList
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - default: 1
        description: Page number for pagination
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of items per page
        in: query
        name: pageSize
        type: integer
      - description: Filter by appeal ID
        in: query
        name: appeal_id
        type: string
      - description: Filter by customer name
        in: query
        name: customer_name
        type: string
      - description: Filter by description
        in: query
        name: description
        type: string
      - description: Filter by updated date (YYYY-MM-DD)
        in: query
        name: updated_on
        type: string
      - description: 'Filter by status e.g suspended, '
        in: query
        name: status
        type: string
      - description: General search across multiple fields
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Data'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - JwtTokenAuth: []
      summary: Get list of trades on appeal
      tags:
      - Appeals
  /audit-trail:
    get:
      description: Paginated, filterable security log of admin logins and privileged
        actions. Super-admin only. The account-state filter (user=Active|Suspended)
        is accepted but is a property of the actor's account rather than of an access
        event, so it is currently a no-op.
      operationId: ListAdminAuditTrail
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Free text over username, full name or IP address
        in: query
        name: search
        type: string
      - description: Event outcome
        enum:
        - successful
        - failed
        - pending
        in: query
        name: status
        type: string
      - description: Single-day filter, format YYYY-MM-DD
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated access-log events
          schema:
            $ref: '#/definitions/accesslog.AuditTrailPageData'
        "400":
          description: Invalid pagination parameters
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: 'Forbidden: super-admin only'
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: List admin access / audit-trail events
      tags:
      - Audit Trail
  /audit-trail/{id}:
    get:
      description: Returns a single access-log event by id, for the activity detail
        view. Super-admin only.
      operationId: GetAdminAuditTrailEvent
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Access-log event id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The access-log event
          schema:
            $ref: '#/definitions/accesslog.AuditTrailRecordData'
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: 'Forbidden: super-admin only'
          schema:
            type: object
        "404":
          description: Access log not found
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Get one admin access / audit-trail event
      tags:
      - Audit Trail
  /careers/roles:
    get:
      description: Retrieves only published career roles with optional search. Public
        endpoint, no authentication required.
      parameters:
      - description: Search in heading and company overview
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CareerRoleResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: '[Public] Get published career roles'
      tags:
