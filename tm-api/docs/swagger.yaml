      consumes:
      - application/json
      description: Create only — not an upsert. 409 if it already exists. Never echoes
        the value back.
      parameters:
      - description: Personal env prefix, e.g. AUTO_APPROVE
        in: path
        name: prefix
        required: true
        type: string
      - description: New value
        in: body
        name: payload
        required: true
        schema:
