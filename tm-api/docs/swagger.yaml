      description: Paginated, filterable list of white-label partner integration (service
        link) accounts, each enriched with a summary of its owner's user record.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: pageSize
        type: integer
