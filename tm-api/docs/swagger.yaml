  /me/vault-signer/personal-envs:
    get:
      description: Never returns a value — only prefix, label, derived key name, and
        whether it exists.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: org member has not linked a Trovo wallet
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Vault signer is not configured on this server
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      - OrganizationAuth: []
      summary: List my personal secret prefixes
      tags:
      - Vault Signer - Personal Secrets
  /me/vault-signer/personal-envs/{prefix}:
    delete:
      description: Fully purges the secret from Vault (not a soft delete). 404 if
        it doesn't exist.
      parameters:
      - description: Personal env prefix, e.g. AUTO_APPROVE
        in: path
        name: prefix
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: org member has not linked a Trovo wallet
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Vault signer is not configured on this server
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      - OrganizationAuth: []
      summary: Delete my personal secret
      tags:
      - Vault Signer - Personal Secrets
    post:
      consumes:
      - application/json
      description: Create only — not an upsert. 409 if it already exists. Never echoes
        the value back.
      parameters:
      - description: Personal env prefix, e.g. AUTO_APPROVE
        in: path
        name: prefix
        required: true
        type: string
      - description: New value
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.createPersonalEnvRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "403":
          description: org member has not linked a Trovo wallet
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Vault signer is not configured on this server
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      - OrganizationAuth: []
      summary: Create my personal secret
      tags:
      - Vault Signer - Personal Secrets
  /me/vault-signer/secrets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Vault signer is not configured on this server
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      - OrganizationAuth: []
      summary: List my signer secrets and assigned positions
      tags:
      - Vault Signer - Self Service
  /me/vault-signer/secrets/{secretId}:
    get:
      parameters:
      - description: Managed secret ID
        in: path
        name: secretId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Vault signer is not configured on this server
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      - OrganizationAuth: []
      summary: Get the current value of my signer slot
      tags:
      - Vault Signer - Self Service
    put:
      consumes:
      - application/json
      description: For an active position (< the managed secret's active signing count),
        this triggers the on-chain swap flow when the old value is a valid keypair,
        the new value is a valid+activated keypair, and the two differ. Otherwise
        it's a plain validated write.
      parameters:
      - description: Managed secret ID
        in: path
        name: secretId
        required: true
        type: string
      - description: New signer value
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.putSecretRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Vault signer is not configured on this server
          schema:
            additionalProperties: true
            type: object
      security:
      - JwtTokenAuth: []
      - OrganizationAuth: []
      summary: Submit a new value for my signer slot
      tags:
      - Vault Signer - Self Service
  /observability/capabilities:
    get:
      description: |-
        Which System Health screens this environment can serve. A
        deployment without log aggregation, for example, reports
        trace as unavailable so the interface can say so plainly
        rather than showing an empty result.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/observability.CapabilitiesResponse'
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Available observability features
      tags:
      - Observability
  /observability/health:
    get:
      description: |-
        Live status of every backend service and the host they run on.
        Each service reports its own dependencies (databases, cache,
        blockchain node) with latency, so a degraded dependency is
        visible before it becomes an outage. Polled by the Trovo
        Manager System Health screen.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/observability.HealthResponse'
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Platform health
      tags:
      - Observability
  /observability/issues:
    get:
      description: |-
        Grouped crash reports from every Trovo application (admin,
        wallet and P2P, backend and web). Each entry is one distinct
        error with how many times it has occurred and when it was
        first and last seen.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Maximum issues to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      - description: Filter to one application (project slug)
        in: query
        name: app
        type: string
      - description: Crash reporter search, e.g. is:unresolved
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/observability.IssuesResponse'
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Application errors
      tags:
      - Observability
  /observability/recent-errors:
    get:
      description: |-
        The most recent requests that returned an error, across every
        service. Gives the trace screen a starting point for an admin
        who does not already have a request identifier to hand.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Maximum lines to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/observability.RecentErrorsResponse'
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Recent failed requests
      tags:
      - Observability
  /observability/trace/{request_id}:
    get:
      description: |-
        Returns every log line carrying the given request identifier,
        from every service that handled it, in time order. Each API
        response includes its identifier in the X-Request-ID header,
        and the web applications show it on their error screens - so a
        user's report can be followed end to end.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request identifier from a response header or error screen
        in: path
        name: request_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/observability.TraceResponse'
        "400":
          description: Malformed request identifier
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Trace one request across services
      tags:
      - Observability
  /observability/trends:
    get:
      description: |-
        Request rate, error rate and 95th-percentile response time per
        service over the selected window. The 95th percentile is
        reported rather than an average because an average hides the
        slow requests users actually complain about.
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Time window
        enum:
        - 1h
        - 6h
        - 24h
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/observability.TrendsResponse'
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Traffic and performance trends
      tags:
      - Observability
