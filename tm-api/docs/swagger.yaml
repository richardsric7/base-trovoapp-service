          to Schemas section for models: models.AssetManagerRequest, models.AssetIssuingHouseRequest,
          models.ApprovedAssetCustodianRequest, models.LegalAndProfessionalsRequest,
          models.RatingAgencyRequest, models.TrusteesRequest, models.LegalAdviserRequest,
          models.FinancialAdviserRequest. Include ''id'' in body for update actions.'
        in: body
        name: data
        required: true
        schema:
          type: object
