basePath: /api/v1
definitions:
  accesslog.AuditTrailPageData:
    properties:
      data:
        $ref: '#/definitions/accesslog.paginatedData'
      message:
        example: access logs fetched successfully
        type: string
      status:
        example: 200
        type: integer
    type: object
  accesslog.AuditTrailRecordData:
    properties:
      data:
        $ref: '#/definitions/accesslog.listRow'
      message:
        example: access log fetched successfully
        type: string
      status:
        example: 200
        type: integer
    type: object
  accesslog.listRow:
    properties:
      action:
        description: humanised label rendered in the UI "Action" column
        type: string
      actor_admin_id:
        description: |-
          Actor -- the admin who performed the action. ActorAdminID is nullable because
          a failed login has no resolved admin id (only a submitted username).
        type: integer
      category:
        description: |-
          Category drives retention. Mutations are kept long-term; a future "read"
          category (sensitive reads, not wired yet) will be purged on a schedule.
        type: string
      date:
        description: '"DD Mon, YYYY hh:mm AM/PM"'
        type: string
      detail:
        description: failure reason, or extra context
        type: string
      email:
        type: string
      event:
        description: login.success, admin.suspend, secret.write, …
        type: string
      fullname:
        type: string
      id:
        type: string
      ip_address:
        description: Request context.
        type: string
      location:
        description: '"City, Country" via the existing IPAPI lookup'
        type: string
      login_method:
        description: push_approval | qr -- admin login is delegated, never a password
        type: string
      method:
        description: HTTP method
        type: string
      occurred_at:
        type: string
      path:
        description: request path
        type: string
      role:
        type: string
      status:
        description: successful | failed | pending
        type: string
      target:
        description: |-
          Target of the action, when there is one distinct from the actor (e.g. the
          admin who was suspended, the org that was deactivated, the secret slot written).
        type: string
      user_agent:
        type: string
      username:
        type: string
    type: object
  accesslog.paginatedData:
    properties:
      data:
        items:
          $ref: '#/definitions/accesslog.listRow'
        type: array
      hasNextPage:
        type: boolean
      hasPreviousPage:
        type: boolean
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  handlers.InviteOrgAdminPayload:
