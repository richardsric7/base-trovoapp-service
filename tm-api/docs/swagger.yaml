      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Data'
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - JwtTokenAuth: []
      summary: Get user metrics
      tags:
      - Metrics
  /users/profile:
    get:
      description: Retrieves user profile info
      operationId: GetUserProfile
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Get by user ID
        in: query
        name: id
        type: string
      - description: Get by user email
        in: query
        name: email
        type: string
      - description: Get by username
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Data'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - JwtTokenAuth: []
      summary: Get User Profile Info
      tags:
      - Registrations
  /users/verify/{targetUser}/{loginID}:
    get:
      consumes:
      - application/json
      description: Verifies the login ID of a user based on provided parameters.
      operationId: VerifyLoginID
      parameters:
      - description: Target user's username
        in: path
        name: targetUser
        required: true
        type: string
      - description: Login ID associated with the user
        in: path
        name: loginID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful verification response
          schema:
            type: object
        "400":
          description: Bad request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal server error
          schema:
            type: object
      summary: Verify login ID
      tags:
      - Authentication
  /v1/login/token/refresh:
    post:
      responses:
        "401":
          description: 'Unauthorized: refresh token expired'
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: 'Unprocessable Entity: unable to retrieve refresh token'
          schema:
            additionalProperties:
              type: string
            type: object
  /wallet-balances/{walletPublicKey}:
    get:
      description: Get the wallet balances of the walletPublicKey submitted in the
        URI request
      operationId: GetWalletBalances
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Wallet Public Key
        in: path
        name: walletPublicKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usermetrics.AssetBalances'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - JwtTokenAuth: []
      summary: Get wallet balances
      tags:
      - Wallets
  /wallet/distribution:
    get:
      description: Retrieves data about the distribution of user wallets.
      operationId: GetWalletDistribution
      parameters:
      - default: Bearer <your-token>
        description: JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
