host: localhost:8080
info:
  contact: {}
  description: Core wallet API for the Trovo platform — user accounts, crypto assets,
    deposits/withdrawals, swaps.
  title: Trovo Wallet API
  version: "1.0"
paths:
  /v1/account/recovery/request-email-otp/{targetUser}:
    post:
      parameters:
      - description: Target user identifier
        in: path
        name: targetUser
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: POST /v1/account/recovery/request-email-otp/:targetUser
      tags:
      - users
  /v1/account/recovery/verify-email-otp/{targetUser}/{otp}:
    post:
      parameters:
      - description: Target user identifier
        in: path
        name: targetUser
        required: true
        type: string
      - description: One-time password
        in: path
        name: otp
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: POST /v1/account/recovery/verify-email-otp/:targetUser/:otp
      tags:
      - users
