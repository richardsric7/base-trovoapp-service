server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # next.config.ts has trailingSlash: true, so directory-style URLs (/about/)
    # map to /about/index.html. try_files handles both /about and /about/.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Cache immutable Next.js build assets (_next/static/*) for a long time.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache HTML — pages can change on redeploy.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Gzip common text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;
}
