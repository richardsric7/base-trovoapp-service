version: '3.8'

# ---------------------------------------------------------------------------
# Portainer stack: wallet-api-dev
#
# Pulled from the git repo by Portainer. Image is pre-built by
# .github/workflows/deploy.yml and pushed to DOCR. Redeploys are triggered
# by the per-stack Portainer webhook, which the workflow POSTs after push.
# ---------------------------------------------------------------------------

services:
  wallet-api-dev:
    container_name: wallet-api-dev
    image: registry.digitalocean.com/service-images/trovo-wallet:api-dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallet-api-dev.entrypoints=websecure"
      - "traefik.http.routers.wallet-api-dev.rule=Host(`api.dev.trovo.app`) || Host(`apidev.trovotechnologies.com`)"
      - "traefik.http.routers.wallet-api-dev.service=wallet-api-dev"
      - "traefik.http.routers.wallet-api-dev.tls.certresolver=leresolver"
      - "traefik.http.routers.wallet-api-dev.priority=1"
      - "traefik.http.services.wallet-api-dev.loadbalancer.server.port=8080"

      # Swagger UI behind basic auth
      - "traefik.http.routers.wallet-api-dev-swagger.rule=(Host(`api.dev.trovo.app`) || Host(`apidev.trovotechnologies.com`)) && PathPrefix(`/swagger`)"
      - "traefik.http.routers.wallet-api-dev-swagger.entrypoints=websecure"
      - "traefik.http.routers.wallet-api-dev-swagger.service=wallet-api-dev"
      - "traefik.http.routers.wallet-api-dev-swagger.tls.certresolver=leresolver"
      - "traefik.http.routers.wallet-api-dev-swagger.middlewares=wallet-api-dev-swagger-auth"
      - "traefik.http.routers.wallet-api-dev-swagger.priority=10"
      - "traefik.http.middlewares.wallet-api-dev-swagger-auth.basicauth.users=internal:$$apr1$$fndgX9ur$$l85lRtIs/Zxxzl4/A9ZYd/"
    volumes:
      - "/home/setup/envs/wallet-dev.env:/.env"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    external: true
