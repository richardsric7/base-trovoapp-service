server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Apple App Site Association: no extension, must be served as JSON.
    # Apple's fetcher is picky about Content-Type.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Android App Links.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # SPA: any unknown path falls back to index.html so client-side routing
    # (react-router) can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed CRA build assets aggressively.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache HTML — pages can change on redeploy.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;
}
